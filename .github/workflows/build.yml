name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-engine-windows
          path: |
            build/Release/StarEngine.exe
            Assets

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev libopenal-dev libvorbis-dev
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-engine-linux
          path: |
            build/StarEngine
            Assets

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-engine-macos
          path: |
            build/StarEngine
            Assets

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION=$(grep -m1 'project(StarEngine VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$VERSION-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          mkdir -p staging/windows
          cp artifacts/star-engine-windows/build/Release/StarEngine.exe staging/windows/
          cp -r artifacts/star-engine-windows/Assets staging/windows/
          cd staging/windows
          zip -r ../../release/StarEngine-${{ steps.version.outputs.VERSION }}-windows.zip StarEngine.exe Assets

          mkdir -p staging/linux
          cp artifacts/star-engine-linux/build/StarEngine staging/linux/
          cp -r artifacts/star-engine-linux/Assets staging/linux/
          cd staging/linux
          zip -r ../../release/StarEngine-${{ steps.version.outputs.VERSION }}-linux.zip StarEngine Assets

          mkdir -p staging/macos
          cp artifacts/star-engine-macos/build/StarEngine staging/macos/
          cp -r artifacts/star-engine-macos/Assets staging/macos/
          cd staging/macos
          zip -r ../../release/StarEngine-${{ steps.version.outputs.VERSION }}-macos.zip StarEngine Assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.VERSION }}
          files: release/*.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
